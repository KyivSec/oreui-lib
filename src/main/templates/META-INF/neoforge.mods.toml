modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="oreui-logo.png"
authors="${mod_authors}"
description='''${mod_description}'''
credits="Ore UI design: Miljö AB and Turóczi Ádám (CC BY 4.0). Source and license links: THIRD-PARTY-NOTICES.md in this JAR."
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="oreui_lib.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9.5.1,10)"
ordering="AFTER"
side="CLIENT"
